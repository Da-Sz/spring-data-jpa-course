services:
  db:
    image: postgres:16
    container_name: amigoscode-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: amigoscode
      POSTGRES_USER: amigoscode
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amigoscode -d amigoscode"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data: